<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>서울 인생 시뮬레이션</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; text-align: center; padding: 20px; }
        #game-container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
        #stats { font-weight: bold; margin-bottom: 20px; text-align: left; }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>서울 인생 시뮬레이션</h1>
        <div id="input-section">
            <label for="name">이름:</label>
            <input type="text" id="name" placeholder="이름 입력"><br>
            <label>성별:</label>
            <input type="radio" name="gender" value="남성" id="male" checked>
            <label for="male">남성</label>
            <input type="radio" name="gender" value="여성" id="female">
            <label for="female">여성</label><br>
            <button onclick="startGame()">게임 시작</button>
        </div>
        <div id="game-section" style="display:none;">
            <div id="stats"></div>
            <p id="year-age-text"></p>
            <p id="event-text"></p>
            <div id="choices-section"></div>
        </div>
    </div>
    <script>
        let character = {
            name: "",
            gender: "",
            age: 0,
            year: 0,
            wealth: 0,
            health: 0,
            intelligence: 0,
            isAlive: true
        };

        function startGame() {
            character.name = document.getElementById("name").value;
            character.gender = document.querySelector('input[name="gender"]:checked').value;
            
            // 1988~1992년 사이 랜덤 출생
            character.year = Math.floor(Math.random() * (1992 - 1988 + 1)) + 1988;
            character.age = 0;
            
            // 능력치 랜덤 배정 (1~10)
            character.wealth = Math.floor(Math.random() * 10) + 1;
            character.health = Math.floor(Math.random() * 10) + 1;
            character.intelligence = Math.floor(Math.random() * 10) + 1;

            document.getElementById("input-section").style.display = 'none';
            document.getElementById("game-section").style.display = 'block';
            nextStage();
        }

        function updateUI() {
            document.getElementById("stats").innerHTML = `자산: ${character.wealth} | 건강: ${character.health} | 지능: ${character.intelligence}`;
            document.getElementById("year-age-text").innerText = `${character.year}년 (나이: ${character.age}세)`;
        }

        function nextStage() {
            if (!character.isAlive) return;

            if (character.age >= 40) {
                document.getElementById("event-text").innerText = "시뮬레이션이 종료되었습니다.";
                document.getElementById("choices-section").innerHTML = '<button onclick="location.reload()">처음으로</button>';
                updateUI();
                return;
            }

            character.age += 5;
            character.year += 5;
            updateUI();

            let eventText = "";
            let choices = [];

            // 확률적 사망 이벤트
            if (Math.random() < 0.01 && character.health < 3) {
                character.isAlive = false;
                document.getElementById("event-text").innerText = "불행한 사고로 사망했습니다.";
                document.getElementById("choices-section").innerHTML = '<button onclick="location.reload()">처음으로</button>';
                return;
            }

            if (character.age === 5) {
                eventText = `${character.name}(이)가 서울에서 태어났습니다.`;
                if(character.wealth > 7) eventText += " 유복한 가정에서 자라기 시작합니다.";
                else if(character.wealth < 4) eventText += " 경제적으로 어려운 환경에서 시작합니다.";
                choices = [
                    { text: "놀이터에서 놀기", effect: () => { character.health += 1; } },
                    { text: "책 읽기", effect: () => { character.intelligence += 1; } }
                ];
            } else if (character.age === 10) {
                eventText = `${character.age}세가 되었습니다. IMF 외환위기가 한국을 강타했습니다.`;
                if (character.wealth > 4) { character.wealth -= 2; eventText += " 부모님의 사업이 어려워졌습니다."; }
                choices = [
                    { text: "공부하기", effect: () => { character.intelligence += 1; } },
                    { text: "친구들과 어울리기", effect: () => { character.health += 1; } }
                ];
            } else if (character.age === 15) {
                eventText = `${character.age}세가 되었습니다. 2002년 한일 월드컵으로 온 나라가 들썩입니다.`;
                choices = [
                    { text: "축구 응원하기", effect: () => { character.health += 1; } },
                    { text: "운동하기", effect: () => { character.health += 2; } }
                ];
            } else if (character.age === 20) {
                eventText = `${character.age}세가 되었습니다. 스마트폰이 보급되기 시작합니다.`;
                choices = [
                    { text: "새로운 기술 배우기", effect: () => { character.intelligence += 2; } },
                    { text: "아르바이트 하기", effect: () => { character.wealth += 2; } }
                ];
            } else if (character.age === 25) {
                eventText = `${character.age}세가 되었습니다. 취업 준비 혹은 사회생활을 시작합니다.`;
                if (Math.random() < 0.05) { character.wealth += 10; eventText += " 대박 로또에 당첨되었습니다!"; }
                choices = [
                    { text: "자기계발", effect: () => { character.intelligence += 2; } },
                    { text: "건강 관리", effect: () => { character.health += 2; } }
                ];
            } else if (character.age === 30) {
                eventText = `${character.age}세가 되었습니다. 부동산 가격이 급등하기 시작합니다.`;
                if(character.wealth > 5) { character.wealth += 2; eventText += " 자산 가치가 상승했습니다."; }
                choices = [
                    { text: "저축하기", effect: () => { character.wealth += 2; } },
                    { text: "투자 공부", effect: () => { character.intelligence += 1; } }
                ];
            } else if (character.age === 35) {
                eventText = `${character.age}세가 되었습니다. 팬데믹 상황이 발생했습니다.`;
                if(character.health < 5) { character.health -= 2; eventText += " 건강이 악화되었습니다."; }
                choices = [
                    { text: "재택근무로 적응하기", effect: () => { character.intelligence += 1; } },
                    { text: "운동으로 면역력 키우기", effect: () => { character.health += 2; } }
                ];
            }

            // 능력치 범위 제한 (1~10)
            character.wealth = Math.min(Math.max(character.wealth, 1), 10);
            character.health = Math.min(Math.max(character.health, 1), 10);
            character.intelligence = Math.min(Math.max(character.intelligence, 1), 10);

            document.getElementById("event-text").innerText = eventText;
            
            let choicesSection = document.getElementById("choices-section");
            choicesSection.innerHTML = '';
            choices.forEach(choice => {
                let button = document.createElement("button");
                button.innerText = choice.text;
                button.onclick = function() {
                    choice.effect();
                    nextStage();
                };
                choicesSection.appendChild(button);
            });
        }
    </script>
</body>
</html>
